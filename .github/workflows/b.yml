эname: Build EblanHack ULTIMATE

on:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter ultralytics opencv-python numpy mss pyautogui pydirectinput pynput pywin32 pillow
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "EblanHack_Ultimate" --add-data "cs2_yolov10s.pt;." --hidden-import ultralytics --hidden-import cv2 --hidden-import customtkinter --collect-all ultralytics eblanhack.py
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: EblanHack_Ultimate
        path: dist/EblanHack_Ultimate.exe
        
    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/EblanHack_Ultimate.exe
        name: EblanHack ULTIMATE ${{ github.ref_name }}
        body: |
          🔥 EBLANHACK ULTIMATE
          
          FEATURES:
          - Wallshot (bullet through walls)
          - Autowall (bullet ricochet)
          - Glow ESP
          - Radar Hack
          - Speed Hack
          - No Recoil
          - No Flash
          - BunnyHop
          - Aimbot (YOLO)
          - Triggerbot
          
          HOTKEYS:
          - F1: Toggle bot
          - F3: Toggle triggerbot
          - F5: Toggle wallshot
          - F6: Toggle autowall
          - Alt: Hold for aimbot
          
          HOW TO USE:
          1. Run CS2
          2. Run as ADMINISTRATOR
          3. Click CONNECT
          4. Click START
          
          USE AT YOUR OWN RISK!