name: Build EblanHack ULTIMATE

on:
  push:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter ultralytics opencv-python numpy mss pyautogui pydirectinput pynput pywin32 pillow wmi
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
    - name: Verify model exists
      run: |
        if exist cs2_yolov10s.pt (
          echo [OK] Model found in repo
          dir cs2_yolov10s.pt
        ) else (
          echo [ERROR] Model not found in repo!
          echo Make sure cs2_yolov10s.pt is in the root folder
          exit 1
        )
      shell: cmd
        
    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "EblanHack_Ultimate" --add-data "cs2_yolov10s.pt;." --hidden-import ultralytics --hidden-import cv2 --hidden-import customtkinter --hidden-import wmi --hidden-import win32com --hidden-import win32com.client --collect-all ultralytics eblanhack.py
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: EblanHack_Ultimate
        path: dist/EblanHack_Ultimate.exe
        
    - name: Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: dist/EblanHack_Ultimate.exe
        name: EblanHack ULTIMATE ${{ github.ref_name }}
        body: |
          ╔══════════════════════════════════════╗
          ║   EBLANHACK ULTIMATE v10.0         ║
          ║   Full CS2 Cheat                   ║
          ╚══════════════════════════════════════╝
          
          ## Features
          - Wallshot (bullet through walls)
          - Autowall (bullet ricochet)
          - Glow ESP
          - Radar Hack
          - Speed Hack
          - No Recoil
          - No Flash
          - BunnyHop
          - Aimbot (YOLO)
          - Triggerbot
          - Teleport
          - Spinbot
          
          ## How to use
          1. Run CS2
          2. Run EblanHack_Ultimate.exe as ADMINISTRATOR
          3. Click CONNECT
          4. Click START
          
          ## Requirements
          - Windows 10/11
          - CS2 running
          - Administrator rights
          
          ## Hotkeys
          - F1: Toggle bot
          - F2: Toggle spinbot
          - F3: Toggle triggerbot
          - F5: Toggle wallshot
          - F6: Toggle autowall